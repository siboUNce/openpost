name: openpost-smoke

services:
  openpost:
    image: ${OPENPOST_IMAGE:-saivaree/openpost:current-main-e031fba}
    container_name: openpost-smoke
    restart: unless-stopped
    stop_grace_period: 15s
    env_file:
      - .env
    ports:
      - "100.67.146.88:4407:8080"
    volumes:
      - ./data:/data
    environment:
      OPENPOST_PORT: 8080
      OPENPOST_DATABASE_PATH: /data/db/openpost.db
      OPENPOST_MEDIA_PATH: /data/media
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:2026.9.1
    container_name: openpost-smoke-cloudflared-1
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - --config
      - /etc/cloudflared/config.yml
      - run
    volumes:
      - type: bind
        source: C:/ProgramData/Saivaree/cloudflared/config-docker.yml
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: C:/ProgramData/Saivaree/cloudflared/tunnel.json
        target: /etc/cloudflared/tunnel.json
        read_only: true
        bind:
          create_host_path: false
